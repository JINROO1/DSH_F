name: CI Fedora Edition

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verificar y empaquetar RPM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias nativas de Electron/Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libasound2t64 libgtk-3-0 libxss1 libnotify4 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 \
            xvfb xauth rpm
      - name: Instalar dependencias fijadas
        run: npm ci && npm --prefix runtime ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Cualificar runtime (auditoría, typecheck, unitarias, build, integración real y E2E)
        run: npm run qualify:runtime
      - name: Smoke nativo Electron
        run: xvfb-run -a npm run test:electron
      - name: Empaquetar RPM Fedora
        run: npm run package:fedora
      - name: Generar y verificar checksums SHA-256
        run: |
          cd release
          sha256sum *.rpm > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Generar SBOM y reporte de licencias
        run: |
          npm run sbom
          npm run licenses -- --strict
      - name: Validar metadatos RPM
        run: |
          rpm -qpiv release/*.rpm
          rpm -qpR release/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-fedora-rpm
          path: |
            release/*.rpm
            release/SHA256SUMS
            release/sbom.json
            release/LICENSES.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: |
            test-results/
            playwright-report/
            coverage/
          if-no-files-found: ignore

  fedora-install:
    name: Instalar RPM en Fedora
    needs: verify
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-fedora-rpm
          path: rpms
      - name: Instalar y validar en Fedora
        run: |
          dnf install -y ./rpms/*.rpm desktop-file-utils
          rpm -q dsh-fedora
          desktop-file-validate /usr/share/applications/dsh-fedora.desktop
          test -x /opt/DeepSeek\ Harness\ Fedora/dsh-fedora || test -x /opt/dsh-fedora/dsh-fedora
          ldd "$(rpm -ql dsh-fedora | grep -E '/dsh-fedora$' | head -1)" | grep -v 'not found'

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, fedora-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-fedora-rpm
          path: rpms
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rpms/*.rpm
            rpms/SHA256SUMS
            rpms/sbom.json
            rpms/LICENSES.json
          generate_release_notes: true
